name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Build and test
        run: ./gradlew build test

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: BookReports
          path: build/libs/BookReports-*.jar

  # ROADMAP.md Fase 7: tagging vX.Y.Z (semantic versioning) publishes a GitHub Release with the jar
  # attached. Modrinth/Hangar publication stays manual — those need maintainer-owned project pages.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/BookReports-*.jar
          generate_release_notes: true
