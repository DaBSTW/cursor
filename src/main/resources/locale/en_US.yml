locale:
  name: "English (US)"

report:
  cooldown-active: "<red>You must wait <yellow><cooldown></yellow> before reporting again.</red>"
  daily-limit-reached: "<red>You have reached your daily limit of <limit> reports.</red>"
  self-report-blocked: "<red>You cannot report yourself.</red>"
  target-offline: "<red>That player is not online.</red>"
  target-not-found: "<red>Could not find player '<player>'.</red>"
  duplicate-pending: "<red>You already have a pending report against <player> (ticket #<ticket_id>).</red>"
  submitted: "<green>✅ Report #<ticket_id> submitted. Thank you.</green>"
  cancelled: "<gray>Report cancelled.</gray>"
  book-title: "Report player"
  rate-limited: "<red>You are opening the book too fast, wait a moment.</red>"
  resolved: "<gray>Your report #<ticket_id> has been reviewed by staff.</gray>"
  tool-name: "<yellow>Report Player</yellow>"
  tool-disabled: "<red>The report tool item is not enabled on this server.</red>"
  service-unavailable: "<red>This service is not available right now. Please try again later.</red>"
  status:
    title: "<gold>Your recent reports:</gold>"
    empty: "<gray>You haven't submitted any reports.</gray>"
    line: "<white>#<ticket_id> <player> — <category> [<status>]</white>"

session:
  invalid: "<red>This page is no longer valid, use /report again.</red>"
  owner-mismatch: "<red>This session does not belong to you.</red>"
  expired: "<red>Your report session expired, use /report again.</red>"

book:
  page:
    target-confirm:
      title: "<gold>You are about to report:</gold>"
      subtitle: "<white><player></white>"
      continue: "<green>[ Continue ]</green>"
      cancel: "<red>[ Cancel ]</red>"
    category:
      title: "<gold>Category</gold>"
    subreason:
      title: "<gold>Sub-reason</gold>"
    evidence:
      title: "<gold>Details?</gold>"
      add: "<yellow>[ Add ]</yellow>"
      skip: "<gray>[ Skip ]</gray>"
    summary:
      title: "<gold>Summary</gold>"
      target: "<white>Player: <player></white>"
      category: "<white>Category: <category></white>"
      subreason: "<white>Sub-reason: <sub_reason></white>"
      evidence: "<white>Evidence: <evidence></white>"
      confirm: "<green>[ ✔ Submit report ]</green>"
      confirm-disabled: "<gray>[ ✔ Submit report ] (wait <cooldown>)</gray>"
      cancel: "<red>[ ✘ Cancel ]</red>"
    result:
      title: "<green>✅ Report submitted</green>"
      ticket: "<white>Ticket: #<ticket_id></white>"
      close: "<gray>[ Close ]</gray>"
  select-target:
    title: "<gold>Who do you want to report?</gold>"
    empty: "<gray>No players available to report.</gray>"
    entry: "<white><player></white>"

evidence:
  prompt: "Type the details here"
  too-long: "<red>Details cannot exceed <max> characters.</red>"
  too-short: "<red>Please write at least <min> characters so staff have something to go on.</red>"

staff:
  notify:
    high-priority: "<red>⚠ New high-priority report: <player> — <category></red>"
    view: "<yellow>[ View ]</yellow>"
    teleport: "<aqua>[ Teleport ]</aqua>"
  claim:
    success: "<green>You claimed report #<ticket_id>.</green>"
    already-claimed: "<red>This report was already claimed by <reviewer>.</red>"
  resolve:
    success: "<green>Report #<ticket_id> resolved: <resolution>.</green>"
    already-resolved: "<red>This report was already resolved by another staff member.</red>"
  mark-false:
    success: "<green>Report #<ticket_id> marked as false.</green>"
  notifications:
    enabled: "<green>Report notifications enabled.</green>"
    disabled: "<gray>Report notifications disabled.</gray>"
  queue:
    title: "Report queue"
    filter: "<yellow>Filter: <white><status></white></yellow>"
    search-prompt: "Search by player name"
    lore:
      category: "<gray>Category: <white><category></white></gray>"
      priority: "<gray>Priority: <white><priority></white></gray>"
      reporter: "<gray>Reported by: <white><player></white></gray>"
      reporters-count: "<yellow><count> recent reports in this category</yellow>"
  detail:
    title: "Report #<ticket_id>"
    target: "<gray>Reported: <white><player></white></gray>"
    reporter: "<gray>Reporter: <white><player></white></gray>"
    category: "<gray>Category: <white><category></white></gray>"
    status: "<gray>Status: <white><status></white></gray>"
    live-status: "<gray>Live status: <white><gamemode></white> — ❤ <white><health>/<max_health></white></gray>"
    live-status-effects: "<gray>Active effects: <white><effects></white></gray>"
    live-status-offline: "<gray>Target is currently offline</gray>"
    evidence: "<gray>Evidence: <white><evidence></white></gray>"
    reporter-accuracy: "<yellow>Reporter accuracy: <white><accuracy>%</white> (<total> reports)</yellow>"
    chat-context: "<gray>Recent chat: <white><context></white></gray>"
    coreprotect-context: "<gray>CoreProtect: <white><activity></white></gray>"
    sanction: "<yellow>Sanction: <white><sanction></white></yellow>"
    claim: "<green>[ Claim ]</green>"
    claimed-by: "<gray>Claimed by: <white><player></white></gray>"
    unclaimed: "<gray>Unclaimed</gray>"
    teleport: "<aqua>[ Teleport ]</aqua>"
    history: "<gray>[ View history ]</gray>"
    teleport-incident: "<gold>[ Teleport to incident location ]</gold>"
    no-location: "<red>No location was recorded for this report.</red>"
    distance: "<gray>Distance reporter ↔ target when filed: <white><distance> blocks</white></gray>"
    resolve-sanction: "<green>[ Resolve: Sanction ]</green>"
    resolve-reject: "<red>[ Resolve: Reject ]</red>"
    mark-false: "<dark_red>[ Mark as false ]</dark_red>"
    notes: "<gold>[ Staff notes ]</gold>"
    back: "<gray>[ Back ]</gray>"
  resolve-menu:
    title: "Resolution reason"
    no-evidence: "<white>Not enough evidence</white>"
    not-infraction: "<white>Not a violation</white>"
    duplicate: "<white>Duplicate</white>"
    banned: "<white>Sanctioned</white>"
  sanction-menu:
    title: "Choose a sanction"
    kick: "<yellow>[ Kick ]</yellow>"
    mute: "<gold>[ Mute ]</gold>"
    ban: "<red>[ Ban ]</red>"
  history:
    title: "History for <player>"
    empty: "<gray>No previous reports.</gray>"
  stats:
    reporter: "<yellow><player>: <white><accuracy>%</white> accuracy (<actioned> actioned, <rejected> rejected, <total> total)</yellow>"
    staff: "<yellow><player>: <white><resolved></white> resolved, avg <white><avg_minutes> min</white> claim-to-resolve</yellow>"
  note:
    added: "<green>Note added to report #<ticket_id>.</green>"
    title: "<yellow>Notes for report #<ticket_id>:</yellow>"
    empty: "<gray>No notes yet.</gray>"
  archive:
    archived: "<green>Report #<ticket_id> archived — hidden from the queue, still viewable directly.</green>"
    restored: "<green>Report #<ticket_id> restored to the queue.</green>"
  purge:
    success: "<green>Report #<ticket_id> permanently deleted.</green>"

update:
  notify: "<yellow>⚠ A new BookReports version is available: <white><latest></white> (you have <white><current></white>) — <click:run_command:'/reportadmin update'><green><u>[Update now]</u></green></click> <gray>(<url>)</gray></yellow>"
  up-to-date: "<green>BookReports is up to date (<white><current></white>).</green>"
  staged: "<green>✅ BookReports <white><latest></white> downloaded and staged — it will be installed automatically the next time the server restarts.</green>"
  download-failed: "<red>Could not download the update automatically. Get it manually: <white><url></white></red>"

command:
  reload-success: "<green>Configuration and translations reloaded.</green>"
  reload-failed: "<red>Reload failed: <reason></red>"
  no-permission: "<red>You do not have permission to use this command.</red>"
  player-only: "<red>This command can only be used in-game.</red>"
  unknown-player: "<red>Could not find player '<player>'.</red>"
  usage: "<gray>Usage: <usage></gray>"

error:
  generic: "<red>An unexpected error occurred. Contact an administrator.</red>"
