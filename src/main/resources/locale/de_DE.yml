  owner-mismatch: "<red>Diese Sitzung gehört dir nicht.</red>"
  expired: "<red>Deine Melde-Sitzung ist abgelaufen, benutze erneut /report.</red>"

book:
  page:
    target-confirm:
      title: "<gold>Du bist dabei, zu melden:</gold>"
      subtitle: "<white><player></white>"
      continue: "<green>[ Weiter ]</green>"
      cancel: "<red>[ Abbrechen ]</red>"
    category:
      title: "<gold>Kategorie</gold>"
    subreason:
      title: "<gold>Untergrund</gold>"
    evidence:
      title: "<gold>Details?</gold>"
      add: "<yellow>[ Hinzufügen ]</yellow>"
      skip: "<gray>[ Überspringen ]</gray>"
    summary:
      title: "<gold>Zusammenfassung</gold>"
      target: "<white>Spieler: <player></white>"
      category: "<white>Kategorie: <category></white>"
      subreason: "<white>Untergrund: <sub_reason></white>"
      evidence: "<white>Beweis: <evidence></white>"
      confirm: "<green>[ ✔ Meldung senden ]</green>"
      confirm-disabled: "<gray>[ ✔ Meldung senden ] (warte <cooldown>)</gray>"
      cancel: "<red>[ ✘ Abbrechen ]</red>"
    result:
      title: "<green>✅ Meldung gesendet</green>"
      ticket: "<white>Ticket: #<ticket_id></white>"
      close: "<gray>[ Schließen ]</gray>"
  select-target:
    title: "<gold>Wen möchtest du melden?</gold>"
    empty: "<gray>Keine Spieler zum Melden verfügbar.</gray>"
    entry: "<white><player></white>"

evidence:
  prompt: "Gib hier die Details ein"
  too-long: "<red>Details dürfen <max> Zeichen nicht überschreiten.</red>"
  too-short: "<red>Bitte schreibe mindestens <min> Zeichen, damit das Team etwas zum Arbeiten hat.</red>"

staff:
  notify:
    high-priority: "<red>⚠ Neue Meldung mit hoher Priorität: <player> — <category></red>"
    view: "<yellow>[ Ansehen ]</yellow>"
    teleport: "<aqua>[ Teleportieren ]</aqua>"
