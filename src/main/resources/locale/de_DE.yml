  self-report-blocked: "<red>Du kannst dich nicht selbst melden.</red>"
  target-offline: "<red>Dieser Spieler ist nicht online.</red>"
  target-not-found: "<red>Spieler '<player>' konnte nicht gefunden werden.</red>"
  duplicate-pending: "<red>Du hast bereits eine offene Meldung gegen <player> (Ticket #<ticket_id>).</red>"
  submitted: "<green>✅ Meldung #<ticket_id> gesendet. Danke.</green>"
  cancelled: "<gray>Meldung abgebrochen.</gray>"
  book-title: "Spieler melden"
  rate-limited: "<red>Du öffnest das Buch zu schnell, warte einen Moment.</red>"
  resolved: "<gray>Deine Meldung #<ticket_id> wurde vom Team bearbeitet.</gray>"
  tool-name: "<yellow>Spieler melden</yellow>"
  tool-disabled: "<red>Das Melde-Werkzeug ist auf diesem Server nicht aktiviert.</red>"
  service-unavailable: "<red>Dieser Dienst ist gerade nicht verfügbar. Bitte versuche es später erneut.</red>"
