    success: "<green>Du hast Meldung #<ticket_id> übernommen.</green>"
    already-claimed: "<red>Diese Meldung wurde bereits von <reviewer> übernommen.</red>"
  resolve:
    success: "<green>Meldung #<ticket_id> abgeschlossen: <resolution>.</green>"
    already-resolved: "<red>Diese Meldung wurde bereits von einem anderen Teammitglied abgeschlossen.</red>"
  mark-false:
    success: "<green>Meldung #<ticket_id> als falsch markiert.</green>"
  notifications:
    enabled: "<green>Meldungsbenachrichtigungen aktiviert.</green>"
    disabled: "<gray>Meldungsbenachrichtigungen deaktiviert.</gray>"
  queue:
    title: "Meldungswarteschlange"
    filter: "<yellow>Filter: <white><status></white></yellow>"
    search-prompt: "Nach Spielername suchen"
