    evidence: "<gray>Beweis: <white><evidence></white></gray>"
    reporter-accuracy: "<yellow>Trefferquote des Melders: <white><accuracy>%</white> (<total> Meldungen)</yellow>"
    chat-context: "<gray>Letzter Chat: <white><context></white></gray>"
    coreprotect-context: "<gray>CoreProtect: <white><activity></white></gray>"
    sanction: "<yellow>Sanktion: <white><sanction></white></yellow>"
    claim: "<green>[ Übernehmen ]</green>"
    claimed-by: "<gray>Übernommen von: <white><player></white></gray>"
    unclaimed: "<gray>Nicht übernommen</gray>"
    teleport: "<aqua>[ Teleportieren ]</aqua>"
    history: "<gray>[ Verlauf ansehen ]</gray>"
    teleport-incident: "<gold>[ Zum Vorfallsort teleportieren ]</gold>"
    no-location: "<red>Für diese Meldung wurde kein Standort erfasst.</red>"
    distance: "<gray>Abstand Melder ↔ Gemeldeter bei Meldung: <white><distance> Blöcke</white></gray>"
    resolve-sanction: "<green>[ Abschließen: Sanktionieren ]</green>"
    resolve-reject: "<red>[ Abschließen: Ablehnen ]</red>"
    mark-false: "<dark_red>[ Als falsch markieren ]</dark_red>"
    notes: "<gold>[ Team-Notizen ]</gold>"
    back: "<gray>[ Zurück ]</gray>"
  resolve-menu:
    title: "Grund für den Abschluss"
    no-evidence: "<white>Nicht genug Beweise</white>"
    not-infraction: "<white>Kein Verstoß</white>"
    duplicate: "<white>Duplikat</white>"
    banned: "<white>Sanktioniert</white>"
  sanction-menu:
    title: "Sanktion wählen"
    kick: "<yellow>[ Kicken ]</yellow>"
    mute: "<gold>[ Stummschalten ]</gold>"
    ban: "<red>[ Bannen ]</red>"
