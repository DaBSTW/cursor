  purge:
    success: "<green>Meldung #<ticket_id> endgültig gelöscht.</green>"

update:
  notify: "<yellow>⚠ Eine neue BookReports-Version ist verfügbar: <white><latest></white> (du hast <white><current></white>) — <click:run_command:'/reportadmin update'><green><u>[Jetzt aktualisieren]</u></green></click> <gray>(<url>)</gray></yellow>"
  up-to-date: "<green>BookReports ist aktuell (<white><current></white>).</green>"
  staged: "<green>✅ BookReports <white><latest></white> heruntergeladen und bereitgestellt — wird beim nächsten Serverneustart automatisch installiert.</green>"
  download-failed: "<red>Das Update konnte nicht automatisch heruntergeladen werden. Manuell herunterladen: <white><url></white></red>"

command:
  reload-success: "<green>Konfiguration und Übersetzungen neu geladen.</green>"
  reload-failed: "<red>Neuladen fehlgeschlagen: <reason></red>"
  no-permission: "<red>Du hast keine Berechtigung für diesen Befehl.</red>"
  player-only: "<red>Dieser Befehl kann nur im Spiel verwendet werden.</red>"
  unknown-player: "<red>Spieler '<player>' konnte nicht gefunden werden.</red>"
  usage: "<gray>Verwendung: <usage></gray>"

error:
  generic: "<red>Ein unerwarteter Fehler ist aufgetreten. Kontaktiere einen Administrator.</red>"
