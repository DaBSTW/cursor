    title: "Verlauf für <player>"
    empty: "<gray>Keine vorherigen Meldungen.</gray>"
  stats:
    reporter: "<yellow><player>: <white><accuracy>%</white> Trefferquote (<actioned> sanktioniert, <rejected> abgelehnt, <total> gesamt)</yellow>"
    staff: "<yellow><player>: <white><resolved></white> abgeschlossen, im Schnitt <white><avg_minutes> Min.</white> bis zur Lösung</yellow>"
  note:
    added: "<green>Notiz zu Meldung #<ticket_id> hinzugefügt.</green>"
    title: "<yellow>Notizen zu Meldung #<ticket_id>:</yellow>"
    empty: "<gray>Noch keine Notizen.</gray>"
  archive:
    archived: "<green>Meldung #<ticket_id> archiviert — aus der Warteschlange ausgeblendet, weiterhin direkt einsehbar.</green>"
