locale:
  name: "Español (España)"

report:
  cooldown-active: "<red>Debes esperar <yellow><cooldown></yellow> antes de reportar de nuevo.</red>"
  daily-limit-reached: "<red>Has alcanzado tu límite diario de <limit> reportes.</red>"
  self-report-blocked: "<red>No puedes reportarte a ti mismo.</red>"
  target-offline: "<red>Ese jugador no está conectado.</red>"
  target-not-found: "<red>No se encontró al jugador '<player>'.</red>"
  duplicate-pending: "<red>Ya tienes un reporte pendiente contra <player> (ticket #<ticket_id>).</red>"
  submitted: "<green>✅ Reporte #<ticket_id> enviado. Gracias.</green>"
  cancelled: "<gray>Reporte cancelado.</gray>"
  book-title: "Reportar jugador"
  rate-limited: "<red>Estás abriendo el libro demasiado rápido, espera un momento.</red>"
  resolved: "<gray>Tu reporte #<ticket_id> ha sido revisado por el staff.</gray>"
  tool-name: "<yellow>Reportar Jugador</yellow>"
  tool-disabled: "<red>El item de reporte no está habilitado en este servidor.</red>"
  service-unavailable: "<red>Este servicio no está disponible en este momento. Intentalo más tarde.</red>"
  status:
    title: "<gold>Tus reportes recientes:</gold>"
    empty: "<gray>No has enviado ningún reporte.</gray>"
    line: "<white>#<ticket_id> <player> — <category> [<status>]</white>"

session:
  invalid: "<red>Esta página ya no es válida, usa /report de nuevo.</red>"
  owner-mismatch: "<red>Esta sesión no te pertenece.</red>"
  expired: "<red>Tu sesión de reporte expiró, usa /report de nuevo.</red>"

book:
  page:
    target-confirm:
      title: "<gold>Vas a reportar a:</gold>"
      subtitle: "<white><player></white>"
      continue: "<green>[ Continuar ]</green>"
      cancel: "<red>[ Cancelar ]</red>"
    category:
      title: "<gold>Categoría</gold>"
    subreason:
      title: "<gold>Sub-motivo</gold>"
    evidence:
      title: "<gold>¿Detalles?</gold>"
      add: "<yellow>[ Añadir ]</yellow>"
      skip: "<gray>[ Omitir ]</gray>"
    summary:
      title: "<gold>Resumen</gold>"
      target: "<white>Jugador: <player></white>"
      category: "<white>Categoría: <category></white>"
      subreason: "<white>Sub-motivo: <sub_reason></white>"
      evidence: "<white>Evidencia: <evidence></white>"
      confirm: "<green>[ ✔ Enviar reporte ]</green>"
      confirm-disabled: "<gray>[ ✔ Enviar reporte ] (espera <cooldown>)</gray>"
      cancel: "<red>[ ✘ Cancelar ]</red>"
    result:
      title: "<green>✅ Reporte enviado</green>"
      ticket: "<white>Ticket: #<ticket_id></white>"
      close: "<gray>[ Cerrar ]</gray>"
  select-target:
    title: "<gold>¿A quién quieres reportar?</gold>"
    empty: "<gray>No hay jugadores disponibles para reportar.</gray>"
    entry: "<white><player></white>"

evidence:
  prompt: "Escribe los detalles aquí"
  too-long: "<red>El detalle no puede superar <max> caracteres.</red>"
  too-short: "<red>Escribe al menos <min> caracteres para darle algo al staff con qué trabajar.</red>"

staff:
  notify:
    high-priority: "<red>⚠ Nuevo reporte de alta prioridad: <player> — <category></red>"
    view: "<yellow>[ Ver ]</yellow>"
    teleport: "<aqua>[ Teleport ]</aqua>"
  claim:
    success: "<green>Has reclamado el reporte #<ticket_id>.</green>"
    already-claimed: "<red>Este reporte ya fue reclamado por <reviewer>.</red>"
  resolve:
    success: "<green>Reporte #<ticket_id> resuelto: <resolution>.</green>"
    already-resolved: "<red>Este reporte ya fue resuelto por otro miembro del staff.</red>"
  mark-false:
    success: "<green>Reporte #<ticket_id> marcado como falso.</green>"
  notifications:
    enabled: "<green>Notificaciones de reportes activadas.</green>"
    disabled: "<gray>Notificaciones de reportes desactivadas.</gray>"
  queue:
    title: "Cola de reportes"
    filter: "<yellow>Filtro: <white><status></white></yellow>"
    search-prompt: "Buscar por nombre de jugador"
    lore:
      category: "<gray>Categoría: <white><category></white></gray>"
      priority: "<gray>Prioridad: <white><priority></white></gray>"
      reporter: "<gray>Reportado por: <white><player></white></gray>"
      reporters-count: "<yellow><count> reportes recientes en esta categoría</yellow>"
  detail:
    title: "Reporte #<ticket_id>"
    target: "<gray>Reportado: <white><player></white></gray>"
    reporter: "<gray>Reportante: <white><player></white></gray>"
    category: "<gray>Categoría: <white><category></white></gray>"
    status: "<gray>Estado: <white><status></white></gray>"
    live-status: "<gray>Estado en vivo: <white><gamemode></white> — ❤ <white><health>/<max_health></white></gray>"
    live-status-effects: "<gray>Efectos activos: <white><effects></white></gray>"
    live-status-offline: "<gray>El jugador está desconectado</gray>"
    evidence: "<gray>Evidencia: <white><evidence></white></gray>"
    reporter-accuracy: "<yellow>Precisión del reportante: <white><accuracy>%</white> (<total> reportes)</yellow>"
    chat-context: "<gray>Chat reciente: <white><context></white></gray>"
    coreprotect-context: "<gray>CoreProtect: <white><activity></white></gray>"
    sanction: "<yellow>Sanción: <white><sanction></white></yellow>"
    claim: "<green>[ Reclamar ]</green>"
    claimed-by: "<gray>Reclamado por: <white><player></white></gray>"
    unclaimed: "<gray>Sin reclamar</gray>"
    teleport: "<aqua>[ Teletransportarse ]</aqua>"
    history: "<gray>[ Ver historial ]</gray>"
    teleport-incident: "<gold>[ Teletransportarse al lugar del incidente ]</gold>"
    no-location: "<red>No se registró una ubicación para este reporte.</red>"
    distance: "<gray>Distancia reportante ↔ reportado al enviarlo: <white><distance> bloques</white></gray>"
    resolve-sanction: "<green>[ Resolver: Sancionar ]</green>"
    resolve-reject: "<red>[ Resolver: Rechazar ]</red>"
    mark-false: "<dark_red>[ Marcar como falso ]</dark_red>"
    notes: "<gold>[ Notas del staff ]</gold>"
    back: "<gray>[ Volver ]</gray>"
  resolve-menu:
    title: "Motivo de resolución"
    no-evidence: "<white>No hay evidencia suficiente</white>"
    not-infraction: "<white>No es una infracción</white>"
    duplicate: "<white>Duplicado</white>"
    banned: "<white>Sancionado</white>"
  sanction-menu:
    title: "Elige una sanción"
    kick: "<yellow>[ Expulsar ]</yellow>"
    mute: "<gold>[ Silenciar ]</gold>"
    ban: "<red>[ Banear ]</red>"
  history:
    title: "Historial de <player>"
    empty: "<gray>Sin reportes previos.</gray>"
  stats:
    reporter: "<yellow><player>: <white><accuracy>%</white> de precisión (<actioned> con acción, <rejected> rechazados, <total> totales)</yellow>"
    staff: "<yellow><player>: <white><resolved></white> resueltos, promedio <white><avg_minutes> min</white> de reclamo a resolución</yellow>"
  note:
    added: "<green>Nota agregada al reporte #<ticket_id>.</green>"
    title: "<yellow>Notas del reporte #<ticket_id>:</yellow>"
    empty: "<gray>Aún no hay notas.</gray>"
  archive:
    archived: "<green>Reporte #<ticket_id> archivado — oculto de la cola, sigue visible directamente.</green>"
    restored: "<green>Reporte #<ticket_id> restaurado a la cola.</green>"
  purge:
    success: "<green>Reporte #<ticket_id> eliminado permanentemente.</green>"

update:
  notify: "<yellow>⚠ Hay una nueva versión de BookReports disponible: <white><latest></white> (tenés <white><current></white>) — <click:run_command:'/reportadmin update'><green><u>[Actualizar ahora]</u></green></click> <gray>(<url>)</gray></yellow>"
  up-to-date: "<green>BookReports está actualizado (<white><current></white>).</green>"
  staged: "<green>✅ BookReports <white><latest></white> descargado y preparado — se instalará automáticamente la próxima vez que se reinicie el servidor.</green>"
  download-failed: "<red>No se pudo descargar la actualización automáticamente. Descargala manualmente: <white><url></white></red>"

command:
  reload-success: "<green>Configuración y traducciones recargadas.</green>"
  reload-failed: "<red>No se pudo recargar: <reason></red>"
  no-permission: "<red>No tienes permiso para usar este comando.</red>"
  player-only: "<red>Este comando solo puede usarse en el juego.</red>"
  unknown-player: "<red>No se encontró al jugador '<player>'.</red>"
  usage: "<gray>Uso: <usage></gray>"

error:
  generic: "<red>Ocurrió un error inesperado. Contacta a un administrador.</red>"
