    high-priority: "<red>⚠ Novo reporte de alta prioridade: <player> — <category></red>"
    view: "<yellow>[ Ver ]</yellow>"
    teleport: "<aqua>[ Teleportar ]</aqua>"
  claim:
    success: "<green>Você reclamou o reporte #<ticket_id>.</green>"
    already-claimed: "<red>Este reporte já foi reclamado por <reviewer>.</red>"
  resolve:
    success: "<green>Reporte #<ticket_id> resolvido: <resolution>.</green>"
    already-resolved: "<red>Este reporte já foi resolvido por outro membro da equipe.</red>"
  mark-false:
    success: "<green>Reporte #<ticket_id> marcado como falso.</green>"
  notifications:
    enabled: "<green>Notificações de reportes ativadas.</green>"
    disabled: "<gray>Notificações de reportes desativadas.</gray>"
  queue:
