      priority: "<gray>Prioridade: <white><priority></white></gray>"
      reporter: "<gray>Reportado por: <white><player></white></gray>"
      reporters-count: "<yellow><count> reportes recentes nesta categoria</yellow>"
  detail:
    title: "Reporte #<ticket_id>"
    target: "<gray>Reportado: <white><player></white></gray>"
    reporter: "<gray>Reportante: <white><player></white></gray>"
    category: "<gray>Categoria: <white><category></white></gray>"
    status: "<gray>Status: <white><status></white></gray>"
    evidence: "<gray>Evidência: <white><evidence></white></gray>"
    reporter-accuracy: "<yellow>Precisão do reportante: <white><accuracy>%</white> (<total> reportes)</yellow>"
    chat-context: "<gray>Chat recente: <white><context></white></gray>"
    coreprotect-context: "<gray>CoreProtect: <white><activity></white></gray>"
    sanction: "<yellow>Sanção: <white><sanction></white></yellow>"
    claim: "<green>[ Reclamar ]</green>"
    claimed-by: "<gray>Reclamado por: <white><player></white></gray>"
    unclaimed: "<gray>Não reclamado</gray>"
    teleport: "<aqua>[ Teleportar ]</aqua>"
    history: "<gray>[ Ver histórico ]</gray>"
    resolve-sanction: "<green>[ Resolver: Sancionar ]</green>"
    resolve-reject: "<red>[ Resolver: Rejeitar ]</red>"
    mark-false: "<dark_red>[ Marcar como falso ]</dark_red>"
    back: "<gray>[ Voltar ]</gray>"
  resolve-menu:
    title: "Motivo da resolução"
    no-evidence: "<white>Evidência insuficiente</white>"
    not-infraction: "<white>Não é uma infração</white>"
    duplicate: "<white>Duplicado</white>"
    banned: "<white>Sancionado</white>"
  sanction-menu:
    title: "Escolha uma sanção"
    kick: "<yellow>[ Expulsar ]</yellow>"
    mute: "<gold>[ Silenciar ]</gold>"
    ban: "<red>[ Banir ]</red>"
  history:
    title: "Histórico de <player>"
    empty: "<gray>Nenhum reporte anterior.</gray>"
  stats:
    reporter: "<yellow><player>: <white><accuracy>%</white> de precisão (<actioned> aplicados, <rejected> rejeitados, <total> total)</yellow>"
    staff: "<yellow><player>: <white><resolved></white> resolvidos, média de <white><avg_minutes> min</white> entre reclamar e resolver</yellow>"

update:
  notify: "<yellow>⚠ Uma nova versão do BookReports está disponível: <white><latest></white> (você tem <white><current></white>) — <white><url></white></yellow>"
  up-to-date: "<green>BookReports está atualizado (<white><current></white>).</green>"

command:
  reload-success: "<green>Configuração e traduções recarregadas.</green>"
  reload-failed: "<red>Falha ao recarregar: <reason></red>"
  no-permission: "<red>Você não tem permissão para usar este comando.</red>"
  player-only: "<red>Este comando só pode ser usado dentro do jogo.</red>"
  unknown-player: "<red>Não foi possível encontrar o jogador '<player>'.</red>"
  usage: "<gray>Uso: <usage></gray>"

error:
  generic: "<red>Ocorreu um erro inesperado. Contate um administrador.</red>"
