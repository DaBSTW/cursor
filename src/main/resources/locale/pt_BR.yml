locale:
  name: "Português (Brasil)"

report:
  cooldown-active: "<red>Você deve esperar <yellow><cooldown></yellow> antes de reportar novamente.</red>"
  daily-limit-reached: "<red>Você atingiu seu limite diário de <limit> reportes.</red>"
  self-report-blocked: "<red>Você não pode reportar a si mesmo.</red>"
  target-offline: "<red>Esse jogador não está online.</red>"
  target-not-found: "<red>Não foi possível encontrar o jogador '<player>'.</red>"
  duplicate-pending: "<red>Você já tem um reporte pendente contra <player> (ticket #<ticket_id>).</red>"
  submitted: "<green>✅ Reporte #<ticket_id> enviado. Obrigado.</green>"
  cancelled: "<gray>Reporte cancelado.</gray>"
  book-title: "Reportar jogador"
  rate-limited: "<red>Você está abrindo o livro rápido demais, espere um momento.</red>"
  resolved: "<gray>Seu reporte #<ticket_id> foi analisado pela equipe.</gray>"
  tool-name: "<yellow>Reportar Jogador</yellow>"
  tool-disabled: "<red>O item de reporte não está habilitado neste servidor.</red>"
  status:
    title: "<gold>Seus reportes recentes:</gold>"
    empty: "<gray>Você ainda não enviou nenhum reporte.</gray>"
    line: "<white>#<ticket_id> <player> — <category> [<status>]</white>"

session:
  invalid: "<red>Esta página não é mais válida, use /report novamente.</red>"
  owner-mismatch: "<red>Esta sessão não pertence a você.</red>"
  expired: "<red>Sua sessão de reporte expirou, use /report novamente.</red>"

book:
  page:
    target-confirm:
      title: "<gold>Você está prestes a reportar:</gold>"
      subtitle: "<white><player></white>"
      continue: "<green>[ Continuar ]</green>"
      cancel: "<red>[ Cancelar ]</red>"
    category:
      title: "<gold>Categoria</gold>"
    subreason:
      title: "<gold>Sub-motivo</gold>"
    evidence:
      title: "<gold>Detalhes?</gold>"
      add: "<yellow>[ Adicionar ]</yellow>"
      skip: "<gray>[ Pular ]</gray>"
    summary:
      title: "<gold>Resumo</gold>"
      target: "<white>Jogador: <player></white>"
      category: "<white>Categoria: <category></white>"
      subreason: "<white>Sub-motivo: <sub_reason></white>"
      evidence: "<white>Evidência: <evidence></white>"
      confirm: "<green>[ ✔ Enviar reporte ]</green>"
      confirm-disabled: "<gray>[ ✔ Enviar reporte ] (espere <cooldown>)</gray>"
      cancel: "<red>[ ✘ Cancelar ]</red>"
    result:
      title: "<green>✅ Reporte enviado</green>"
      ticket: "<white>Ticket: #<ticket_id></white>"
      close: "<gray>[ Fechar ]</gray>"
  select-target:
    title: "<gold>Quem você quer reportar?</gold>"
    empty: "<gray>Nenhum jogador disponível para reportar.</gray>"
    entry: "<white><player></white>"

evidence:
  prompt: "Digite os detalhes aqui"
  too-long: "<red>Os detalhes não podem exceder <max> caracteres.</red>"

staff:
