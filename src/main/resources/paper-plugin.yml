name: BookReports
version: '${version}'
main: dev.bookreports.BookReportsPlugin
api-version: '1.21'
folia-supported: true
description: Hypixel-style book report system for Paper servers.
author: DaBSTW
website: https://github.com/DaBSTW/cursor

softdepend:
  - PlaceholderAPI
  - LiteBans
  - AdvancedBan
  - Essentials

# Commands are registered programmatically via the Brigadier lifecycle event
# (BookReportsPlugin#registerCommands) — Paper plugins have not supported this YAML
# `commands:` block since Paper 26.x; JavaPlugin#getCommand throws at startup instead.
# See ComponentUtil for why the internal book-click commands are named distinctively
# (bookreports-select/bookreports-target) rather than something generic like "select".

permissions:
  bookreports.report:
    description: Allows submitting player reports via /report.
    default: true
  bookreports.report.tool:
    description: Allows obtaining the physical report-tool item.
    default: false
  bookreports.staff:
    description: Allows opening the staff review queue.
    default: op
  bookreports.staff.resolve:
    description: Allows resolving reports from the console.
    default: op
  bookreports.staff.notify:
    description: Receives live in-game alerts for high-priority reports.
    default: op
  bookreports.admin:
    description: Allows reloading configuration and locale files.
    default: op
