# BookReports configuration. Reload with /reportsreload after editing — no restart needed.
storage:
  type: sqlite # sqlite | mysql
  mysql:
    host: localhost
    port: 3306
    database: bookreports
    user: root
    password: ""
    pool-size: 10

report:
  cooldown-seconds: 120
  daily-limit: 10
  session-timeout-seconds: 300
  prevent-self-report: true
  prevent-duplicate-pending: true

  categories:
    hacks:
      display: "<green>⚔ Hacks / Cheats</green>"
      priority: HIGH
      sub-reasons: [killaura, speed, fly, reach, xray, other]
    chat_abuse:
      display: "<yellow>💬 Chat abusivo / Spam</yellow>"
      priority: MEDIUM
      sub-reasons: [spam, harassment, advertising, other]
    inappropriate_name:
      display: "<gold>🏷 Nombre o skin inapropiado</gold>"
      priority: LOW
      sub-reasons: []
    bug_abuse:
      display: "<red>🐛 Abuso de bugs / Exploits</red>"
      priority: HIGH
      sub-reasons: []
    staff_impersonation:
      display: "<dark_red>🛡 Suplantación de staff</dark_red>"
      priority: HIGH
      sub-reasons: []
    other:
      display: "<gray>❓ Otro</gray>"
      priority: LOW
      sub-reasons: []

priority-escalation:
  distinct-reporters-threshold: 3
  window-seconds: 600
  escalate-to: HIGH

false-report-penalty:
  enabled: true
  threshold-in-30-days: 3
  cooldown-multiplier: 4
  mute-minutes: 0

enable-report-tool: false

staff:
  alert-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  claim-timeout-minutes: 15

discord:
  enabled: false
  webhook-url: ""
  min-priority-to-notify: HIGH

# Durations passed verbatim to whichever punishment plugin is detected (LiteBans/AdvancedBan
# both understand this format, e.g. "7d", "1h", "perm") when staff use the quick-sanction menu.
punishments:
  default-ban-duration: 7d
  default-mute-duration: 1h

# Optional: attaches a short summary of the target's recent CoreProtect-logged block activity to new reports,
# same spirit as the automatic chat-context capture (always on, no config needed for that one). No effect
# unless CoreProtect is installed.
coreprotect:
  enabled: true
  lookback-seconds: 300
  max-entries: 20

# Checks for a newer BookReports release and logs a console line (and, optionally, tells online ops) when one is
# found. Never blocks startup and never throws on a network problem — a failed check is just silently retried on
# the next interval. `source: github` reads GitHub Releases; `source: modrinth` reads a Modrinth project's
# versions instead — `resource` is "owner/repo" for github, a project slug/id for modrinth.
# IMPORTANT: whenever this check finds a newer version, /report and the report-tool item stop working for
# everyone without bookreports.admin (they see a plain "not available" message) until the server is updated —
# ops are unaffected and get a one-click updater ("/reportadmin update", also clickable from the join
# notification). This is not configurable — the only way to avoid the lock is to keep BookReports up to date,
# or to turn the checker off entirely below (enabled: false).
update-checker:
  enabled: true
  source: github
  resource: "DaBSTW/cursor"
  check-interval-hours: 12
  notify-ops-on-join: true

placeholderapi: true

# Anonymous usage stats (bstats.org): server count, versions, plugin config summary — never player data.
metrics:
  enabled: true

# Bundled: en_US, es_ES, pt_BR, de_DE, fr_FR, ru_RU, zh_CN. Drop your own
# locale/<code>.yml in the plugin's data folder to add another or override one.
locale: en_US
debug: false

# Identifies this backend in the `server` column when multiple Paper instances share one
# MySQL database behind a proxy (Fase 6). Irrelevant for a standalone SQLite server.
server-id: default
